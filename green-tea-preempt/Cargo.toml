[package]
name = "green-tea-preempt"
description = "A bare-metal kernel for riscv64 and aarch64 whose tasks never yield: a timer interrupt preempts them, and a ramfb display shows the switches."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Builds for riscv64gc-unknown-none-elf and aarch64-unknown-none: it needs a board that
# implements green-tea-bare's TimerInterrupt. Run it with: cargo xtask kernel --kernel preempt

[[bin]]
name = "green-tea-preempt"
test = false
bench = false

[dependencies]
green-tea-bare = { path = "../green-tea-bare" }
