[workspace]
members = [
    "green-tea-v1",
    "green-tea-v2",
    "green-tea-arch",
    "green-tea-pool",
    "green-tea-fit",
    "green-tea-kmem",
    "green-tea-region",
    "green-tea-trace",
    "green-tea-measure",
    "green-tea-smp",
    "green-tea-lisp",
    "green-tea-shard",
    "green-tea-smr",
    "drivers/*",
    "green-tea-bare",
    "green-tea-coop",
    "green-tea-preempt",
    "green-tea-shell",
    "xtask",
]
# What a plain `cargo build` / `cargo test` covers: everything that builds for the host.
# green-tea-bare, the kernels and the drivers with no host tests build only for bare-metal targets: cargo xtask kernel.
default-members = ["green-tea-v1", "green-tea-v2", "green-tea-arch", "green-tea-pool", "green-tea-fit", "green-tea-kmem", "green-tea-region", "green-tea-trace", "green-tea-measure", "green-tea-smp", "green-tea-lisp", "green-tea-shard", "green-tea-smr", "drivers/acpi", "drivers/framebuffer", "drivers/i8042", "drivers/ioapic", "drivers/multiboot2", "drivers/pci", "drivers/fw-cfg", "drivers/virtio", "drivers/virtio-blk", "drivers/nvme", "drivers/xhci", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Javier Fernandez"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jfernand/green-tea"
homepage = "https://jotafernand.casaroja.es/posts/019-multitasking/"
publish = false # a learning project, not a crate (yet)
