[workspace]
members = [
    "green-tea-v1",
    "green-tea-v2",
    "green-tea-arch",
    "green-tea-bare",
    "green-tea-coop",
    "green-tea-preempt",
    "xtask",
]
# What a plain `cargo build` / `cargo test` covers: everything that builds for the host.
# green-tea-bare and the kernels build only for bare-metal targets: cargo xtask kernel.
default-members = ["green-tea-v1", "green-tea-v2", "green-tea-arch", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Javier Fernandez"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jfernand/green-tea"
homepage = "https://jotafernand.casaroja.es/posts/019-multitasking/"
publish = false # a learning project, not a crate (yet)
