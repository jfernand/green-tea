[package]
name = "green-tea-scheduler-preempt"
description = "A timer-preemptive scheduler for green-tea bare-metal kernels."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["green"]
green = ["green-tea-bare/green", "green-tea-scheduler-coop/green"]
black = ["green-tea-bare/black", "green-tea-scheduler-coop/black"]
white = ["green-tea-bare/white", "green-tea-scheduler-coop/white"]
board-pc = ["green-tea-bare/board-pc", "green-tea-scheduler-coop/board-pc"]

[dependencies]
green-tea-bare = { path = "../../green-tea-bare", default-features = false }
green-tea-scheduler-coop = { path = "../coop", default-features = false }