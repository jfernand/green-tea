[package]
name = "green-tea-ns16550"
description = "A transmit-only 16550 UART driver, memory-mapped or on x86 I/O ports."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# no_std; builds for the bare-metal targets (riscv64gc-unknown-none-elf,
# aarch64-unknown-none, x86_64-unknown-none). See drivers/README.md.

[lib]
test = false
bench = false

# Only the I/O-port flavour, which is x86's, needs green-tea-io.
[target.'cfg(target_arch = "x86_64")'.dependencies]
green-tea-io = { path = "../io" }
