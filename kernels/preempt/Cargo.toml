[package]
name = "green-tea-preempt"
description = "A bare-metal kernel for riscv64, aarch64 and x86_64 whose tasks never yield: a timer interrupt preempts them, and a ramfb display shows the switches."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Builds for riscv64gc-unknown-none-elf, aarch64-unknown-none and x86_64-unknown-none: it needs a board that
# implements green-tea-bare's TimerInterrupt. Run it with: cargo xtask kernel --kernel preempt

[[bin]]
name = "green-tea-preempt"
test = false
bench = false

[features]
default = ["green"]
green = ["green-tea-bare/green", "green-tea-scheduler-preempt/green"]
black = ["green-tea-bare/black", "green-tea-scheduler-preempt/black"]
white = ["green-tea-bare/white", "green-tea-scheduler-preempt/white"]
board-pc = ["green-tea-bare/board-pc", "green-tea-scheduler-preempt/board-pc"]

[dependencies]
green-tea-bare = { path = "../../green-tea-bare", default-features = false }
green-tea-scheduler-preempt = { path = "../../schedulers/preempt", default-features = false }
