[package]
name = "green-tea-black"
description = "An x86_64 protected-process demonstration for Black Tea."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "green-tea-black"
test = false
bench = false

[features]
default = ["black"]
black = ["green-tea-bare/black", "green-tea-scheduler-coop/black"]
board-pc = ["green-tea-bare/board-pc", "green-tea-scheduler-coop/board-pc"]

[dependencies]
green-tea-bare = { path = "../../green-tea-bare", default-features = false }
green-tea-scheduler-coop = { path = "../../schedulers/coop", default-features = false }