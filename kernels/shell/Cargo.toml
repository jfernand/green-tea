[package]
name = "green-tea-shell"
description = "A bare-metal kernel for riscv64, aarch64 and x86_64 with a small shell on the serial console, whose commands allocate from the heap or from an arena."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Builds only for riscv64gc-unknown-none-elf, aarch64-unknown-none and x86_64-unknown-none
# (all panic=abort). Type at it with: cargo xtask shell. Test it with:
# cargo xtask kernel --kernel shell

[[bin]]
name = "green-tea-shell"
test = false
bench = false

[features]
default = ["green"]
green = ["green-tea-bare/green", "green-tea-scheduler-coop/green"]
black = ["green-tea-bare/black", "green-tea-scheduler-coop/black"]
white = ["green-tea-bare/white", "green-tea-scheduler-coop/white"]
board-pc = ["green-tea-bare/board-pc", "green-tea-scheduler-coop/board-pc"]

[dependencies]
green-tea-bare = { path = "../../green-tea-bare", default-features = false }
green-tea-region = { path = "../../allocators/region" }
green-tea-scheduler-coop = { path = "../../schedulers/coop", default-features = false }
