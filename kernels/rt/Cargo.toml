[package]
name = "green-tea-rt-kernel"
description = "Green Tea fixed-priority realtime scheduling demonstration."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "green-tea-rt-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["green", "white"]
green = ["green-tea-bare/green", "green-tea-rt-bare/green"]
black = ["green-tea-bare/black", "green-tea-rt-bare/black"]
white = ["green-tea-bare/white", "green-tea-rt-bare/white"]
board-pc = ["green-tea-bare/board-pc", "green-tea-rt-bare/board-pc"]

[dependencies]
green-tea-bare = { path = "../../green-tea-bare", default-features = false }
green-tea-rt = { path = "../../schedulers/rt" }
green-tea-rt-bare = { path = "../../schedulers/rt-bare", default-features = false }