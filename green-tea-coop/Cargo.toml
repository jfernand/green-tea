[package]
name = "green-tea-coop"
description = "A bare-metal kernel for riscv64, aarch64 and x86_64 that shows green-tea's cooperative context switches on a ramfb display."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# Builds only for riscv64gc-unknown-none-elf, aarch64-unknown-none and x86_64-unknown-none
# (all panic=abort). Run it with: cargo xtask kernel --kernel coop (or overflow, or disk:
# its tests)

[[bin]]
name = "green-tea-coop"
test = false
bench = false

[dependencies]
green-tea-bare = { path = "../green-tea-bare" }
green-tea-lisp = { path = "../green-tea-lisp" }
green-tea-shard = { path = "../green-tea-shard" }
